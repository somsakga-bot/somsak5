<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบตรวจหาข่าว จังหวัดปราจีนบุรี</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3a6e;--red:#b3261e;--bg:#f2f4f8;--card:#fff;--tx:#1d2433;--mu:#6b7488;--bd:#dde2ec}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(rgba(20,35,70,.78),rgba(20,35,70,.88)),url(header.png) center/cover;color:#fff;padding:18px 20px}
.hd{max-width:1300px;margin:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:68px;height:68px;border-radius:50%;border:3px solid #fff;object-fit:cover;background:#fff}
.hd h1{margin:0;font-size:1.5rem}.hd p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.hd .sp{flex:1}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:#fff;color:var(--navy)}
.btn.p{background:var(--red);color:#fff}.btn.g{background:var(--navy);color:#fff}
main{max-width:1300px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:12px;padding:12px 14px;border-left:5px solid var(--navy)}
.st b{display:block;font-size:1.6rem}.st span{color:var(--mu);font-size:.85rem}
.flt{background:var(--card);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.flt input,.flt select{padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;min-width:130px}
.flt input[type=search]{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--bd);display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.card img{width:100%;height:150px;object-fit:cover}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font-size:1rem;line-height:1.35}
.meta{color:var(--mu);font-size:.8rem}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600;margin:1px 2px 1px 0;background:#e7ecf7;color:var(--navy)}
.c-ความรุนแรง{background:#fde3e1;color:#a11a12}.c-ทรัพย์สิน{background:#ffecd2;color:#9a5300}
.c-ฉ้อโกง\/ทุจริต{background:#ece0fa;color:#5b2a9a}.c-กระแสสังคม{background:#d9ecff;color:#0b5aa8}
.kw{background:#e3f4e8;color:#1b6b3a}
.sc{margin-left:auto;font-weight:700;color:var(--red)}
.empty{text-align:center;color:var(--mu);padding:40px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.on{display:flex}
.md{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.md img{max-width:100%;border-radius:10px}
.md h2{margin:8px 0}
.md table{width:100%;border-collapse:collapse;margin:10px 0}.md td{padding:6px 4px;border-bottom:1px solid var(--bd);vertical-align:top}
.md td:first-child{color:var(--mu);width:130px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* report */
#report{display:none;max-width:1300px;margin:auto;padding:16px}
.rp{background:#fff;padding:20px;border-radius:12px}
.rh{display:flex;gap:14px;align-items:center;border-bottom:3px double var(--navy);padding-bottom:10px;margin-bottom:10px}
.rh img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.rh h2{margin:0}.rh p{margin:2px 0;color:var(--mu);font-size:.9rem}
table.rt{width:100%;border-collapse:collapse;font-size:.85rem}
.rt th{background:var(--navy);color:#fff;padding:6px;text-align:left}.rt td{padding:6px;border:1px solid var(--bd);vertical-align:top;word-break:break-word}
.rbar{display:flex;gap:8px;margin-bottom:12px}
#login{max-width:340px;margin:60px auto;background:#fff;padding:22px;border-radius:14px;text-align:center;display:none}
#login input{width:100%;padding:10px;margin:10px 0;border:1px solid var(--bd);border-radius:8px;font:inherit}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff}header,main,.rbar,.noprint,#login{display:none!important}
 #report{display:block!important;padding:0}.rp{padding:0}
 body.pm header,body.pm #report,body.pm main{display:none!important}
 body.pm .ov{position:static;display:block;background:#fff;padding:0}body.pm .md{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<header><div class="hd">
  <img class="logo" src="logo.png" alt="โลโก้">
  <div><h1>ระบบตรวจหาข่าว จังหวัดปราจีนบุรี</h1><p id="upd">ติดตามข่าวและเนื้อหาสื่อออนไลน์ตามคีย์เวิร์ด</p></div>
  <div class="sp"></div>
  <button class="btn" onclick="goHome()">🏠 หน้าหลัก</button>
  <button class="btn" onclick="runNow(this)">🔄 ตรวจหาตอนนี้</button>
  <button class="btn p" onclick="showReport()">🖨 รายงาน / พิมพ์</button>
</div></header>

<div id="login"><img class="logo" src="logo.png" style="border-color:var(--navy)" alt=""><h3>เข้าสู่ระบบ</h3>
  <input id="pw" type="password" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn g" style="width:100%" onclick="doLogin()">เข้าสู่ระบบ</button><p id="lerr" style="color:var(--red)"></p></div>

<main id="home" style="display:none">
  <div class="stats" id="stats"></div>
  <div class="flt">
    <input type="search" id="q" placeholder="ค้นหาหัวข้อ / คีย์เวิร์ด / แหล่งข่าว" oninput="render()">
    <select id="fp" onchange="render()"><option value="">ทุกแพลตฟอร์ม</option></select>
    <select id="fg" onchange="render()"><option value="">ทุกกลุ่มคีย์เวิร์ด</option></select>
    <select id="fc" onchange="render()"><option value="">ทุกหมวดเหตุการณ์</option></select>
    <select id="fd" onchange="render()"><option value="1">วันนี้</option><option value="3" selected>3 วันล่าสุด</option><option value="7">7 วัน</option><option value="30">30 วัน</option><option value="0">ทั้งหมด</option></select>
    <select id="fs" onchange="render()"><option value="">ไม่รวมที่ไม่เกี่ยวข้อง</option><option value="ใหม่">เฉพาะใหม่</option><option value="ตรวจสอบแล้ว">ตรวจสอบแล้ว</option><option value="ไม่เกี่ยวข้อง">ไม่เกี่ยวข้อง</option><option value="*">ทั้งหมด</option></select>
    <select id="fo" onchange="render()"><option value="date">เรียงตามเวลา</option><option value="score">เรียงตามคะแนน</option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<section id="report"><div class="rbar noprint">
  <button class="btn g" onclick="window.print()">🖨 พิมพ์รายงาน</button>
  <button class="btn p" onclick="goHome()">↩ กลับหน้าหลัก</button></div>
  <div class="rp" id="rp"></div></section>

<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="md" id="md"></div></div>

<script>
// ===== ตั้งค่า: วาง URL ของ Web App (Apps Script) ที่ Deploy แล้ว =====
const API_URL = 'https://script.google.com/macros/s/AKfycbyIyPj7r_8KA70bXkiDqh97li4ICvokYHxDyPEuUT99eR583fUhBrQ7pQTxq0ci3_4/exec';
// =====================================================================
let ALL = [], PW = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';
const tags = (s, cls) => String(s || '').split(/,\s*/).filter(Boolean).map(t => `<span class="tag ${cls || 'c-' + esc(t)}">${esc(t)}</span>`).join('');
const catTags = s => String(s || '').split(/,\s*/).filter(Boolean).map(t => `<span class="tag c-${esc(t)}">${esc(t)}</span>`).join('');
const dt = s => { const d = new Date(String(s).replace(' ', 'T') + '+07:00'); return isNaN(d) ? '' : d.toLocaleString('th-TH', {dateStyle: 'medium', timeStyle: 'short'}); };

function goHome() { closeM(); $('report').style.display = 'none'; $('home').style.display = 'block'; window.scrollTo(0, 0); }
function closeM() { $('ov').classList.remove('on'); document.body.classList.remove('pm'); }

async function api(params) {
  const u = API_URL + '?' + new URLSearchParams(Object.assign({pw: PW}, params));
  const r = await fetch(u); return r.json();
}
async function doLogin() {
  PW = $('pw').value; $('lerr').textContent = 'กำลังตรวจสอบ...';
  await load(true);
}
async function load(fromLogin) {
  try {
    const d = await api({action: 'data'});
    if (!d.ok) { $('login').style.display = 'block'; $('home').style.display = 'none'; $('lerr').textContent = fromLogin ? (d.error === 'auth' ? 'รหัสผ่านไม่ถูกต้อง' : 'ระบบหลังบ้านผิดพลาด: ' + d.error) : ''; return; }
    try { sessionStorage.setItem('pw', PW); } catch (e) {}
    ALL = d.items; $('upd').textContent = 'อัปเดตล่าสุด ' + dt(d.updated) + ' · ติดตามข่าวและเนื้อหาสื่อออนไลน์ตามคีย์เวิร์ด';
    $('login').style.display = 'none'; $('home').style.display = 'block';
    fillSel('fp', 'platform'); fillSel('fg', 'group');
    const cats = [...new Set(ALL.flatMap(x => String(x.cat || '').split(/,\s*/)).filter(Boolean))];
    const cur = $('fc').value; $('fc').innerHTML = '<option value="">ทุกหมวดเหตุการณ์</option>' + cats.map(c => `<option>${esc(c)}</option>`).join(''); $('fc').value = cur;
    render();
  } catch (e) { $('login').style.display = 'block'; $('lerr').textContent = 'เชื่อมต่อไม่ได้ ตรวจสอบ API_URL: ' + e.message; }
}
function fillSel(id, k) {
  const cur = $(id).value, first = $(id).options[0].outerHTML;
  $(id).innerHTML = first + [...new Set(ALL.map(x => x[k]).filter(Boolean))].map(v => `<option>${esc(v)}</option>`).join(''); $(id).value = cur;
}
function filtered() {
  const q = $('q').value.trim().toLowerCase(), days = +$('fd').value, st = $('fs').value;
  const lim = days ? Date.now() - days * 864e5 : 0;
  let r = ALL.filter(x =>
    (!$('fp').value || x.platform === $('fp').value) && (!$('fg').value || x.group === $('fg').value) &&
    (!$('fc').value || String(x.cat).includes($('fc').value)) &&
    (!lim || new Date(x.posted.replace(' ', 'T') + '+07:00') >= lim) &&
    (st === '*' || (st ? x.status === st : x.status !== 'ไม่เกี่ยวข้อง')) &&
    (!q || [x.title, x.desc, x.keyword, x.source, x.event].join(' ').toLowerCase().includes(q)));
  r.sort($('fo').value === 'score' ? (a, b) => b.score - a.score : (a, b) => b.posted.localeCompare(a.posted));
  return r;
}
function render() {
  const r = filtered(), today = new Date().toISOString().slice(0, 10);
  const cnt = f => r.filter(f).length;
  $('stats').innerHTML = [['ทั้งหมดที่พบ', r.length], ['ใหม่ (ยังไม่ตรวจ)', cnt(x => x.status === 'ใหม่')], ['ความรุนแรง', cnt(x => String(x.cat).includes('ความรุนแรง'))],
    ['ฉ้อโกง/ทุจริต', cnt(x => String(x.cat).includes('ฉ้อโกง'))], ['กระแสสังคม', cnt(x => String(x.cat).includes('กระแส'))], ['YouTube', cnt(x => x.platform === 'YouTube')]]
    .map(a => `<div class="st"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('');
  $('grid').innerHTML = r.length ? r.slice(0, 300).map(x => `<div class="card" onclick="openM('${esc(x.id)}')">
    ${x.img ? `<img loading="lazy" src="${esc(safeUrl(x.img))}" alt="">` : ''}
    <div class="cb"><div class="meta">${esc(x.platform)} · ${esc(x.source)} · ${dt(x.posted)}</div>
    <h3>${esc(x.title)}</h3>
    <div><span class="tag kw">🔑 ${esc(x.keyword)}</span>${tags(x.event, 'c-' + esc(String(x.cat).split(',')[0]))}</div>
    <div class="meta" style="display:flex">${esc(x.status)}<span class="sc">คะแนน ${esc(x.score)}</span></div></div></div>`).join('')
    : '<div class="empty" style="grid-column:1/-1">ไม่พบข้อมูลตามเงื่อนไข</div>';
}
function openM(id) {
  const x = ALL.find(a => a.id === id); if (!x) return;
  $('md').innerHTML = `${x.img ? `<img src="${esc(safeUrl(x.img))}" alt="">` : ''}
  <h2>${esc(x.title)}</h2><div>${catTags(x.cat)}</div>
  <table><tr><td>คีย์เวิร์ดที่ตรง</td><td>${esc(x.keyword)} <span class="meta">(${esc(x.group)})</span></td></tr>
  <tr><td>คำเหตุการณ์</td><td>${esc(x.event) || '-'}</td></tr>
  <tr><td>แพลตฟอร์ม</td><td>${esc(x.platform)}</td></tr>
  <tr><td>ผู้โพสต์/แหล่งข่าว</td><td>${esc(x.source)}</td></tr>
  <tr><td>วันที่โพสต์</td><td>${dt(x.posted)}</td></tr>
  <tr><td>รายละเอียด</td><td>${esc(x.desc) || '-'}</td></tr>
  ${x.views !== '' ? `<tr><td>ยอดวิว/ไลก์/คอมเมนต์</td><td>${esc(x.views)} / ${esc(x.likes)} / ${esc(x.comments)}</td></tr>` : ''}
  <tr><td>URL</td><td><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.url)}</a></td></tr>
  <tr><td>สถานะ</td><td><select id="mst" onchange="setSt('${esc(x.id)}',this.value)">${['ใหม่', 'ตรวจสอบแล้ว', 'ไม่เกี่ยวข้อง'].map(s => `<option ${s === x.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr></table>
  <div class="acts noprint"><a class="btn p" style="text-decoration:none" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">เปิดต้นฉบับ ↗</a>
  <button class="btn g" onclick="document.body.classList.add('pm');window.print()">🖨 พิมพ์รายการนี้</button>
  <button class="btn" style="border:1px solid var(--bd)" onclick="closeM()">↩ กลับหน้าหลัก</button></div>`;
  $('ov').classList.add('on');
}
async function setSt(id, s) { const x = ALL.find(a => a.id === id); x.status = s; try { await api({action: 'status', id, status: s}); } catch (e) {} render(); }
async function runNow(b) {
  b.disabled = true; const t = b.textContent; b.textContent = '⏳ กำลังตรวจหา...';
  try { await api({action: 'run'}); await load(); } catch (e) { alert('ดำเนินการไม่สำเร็จ: ' + e.message); }
  b.disabled = false; b.textContent = t;
}
function showReport() {
  const r = filtered(), v = id => { const s = $(id); return s.options[s.selectedIndex].text; };
  $('rp').innerHTML = `<div class="rh"><img src="logo.png" alt=""><div><h2>รายงานข่าวและเนื้อหาสื่อออนไลน์ จังหวัดปราจีนบุรี</h2>
  <p>เงื่อนไข: ${esc(v('fp'))} | ${esc(v('fg'))} | ${esc(v('fc'))} | ${esc(v('fd'))} | ${esc(v('fs'))}${$('q').value ? ' | ค้นหา "' + esc($('q').value) + '"' : ''}</p>
  <p>พิมพ์เมื่อ ${new Date().toLocaleString('th-TH', {dateStyle: 'long', timeStyle: 'short'})} · จำนวน ${r.length} รายการ</p></div></div>
  <table class="rt"><tr><th>#</th><th>วันที่โพสต์</th><th>แพลตฟอร์ม</th><th>คีย์เวิร์ด</th><th>เหตุการณ์</th><th>หัวข้อ</th><th>แหล่งข่าว/ผู้โพสต์</th><th>URL</th><th>สถานะ</th></tr>
  ${r.map((x, i) => `<tr><td>${i + 1}</td><td>${dt(x.posted)}</td><td>${esc(x.platform)}</td><td>${esc(x.keyword)}</td><td>${esc(x.event)}</td><td>${esc(x.title)}</td><td>${esc(x.source)}</td><td>${esc(x.url)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table>`;
  $('home').style.display = 'none'; $('report').style.display = 'block'; window.scrollTo(0, 0);
}
try { PW = sessionStorage.getItem('pw') || ''; } catch (e) {}
if (PW) load(); else $('login').style.display = 'block';
</script>
</body>
</html>
